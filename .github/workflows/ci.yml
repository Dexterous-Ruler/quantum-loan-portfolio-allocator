name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # artifacts/scored_applicants.csv is committed, but regenerate it so CI also proves
      # the model trains from a clean checkout and the UCI download still works.
      - name: Train the AI model
        run: python src/ai_model.py

      - name: Run tests (fast)
        run: pytest tests -q

      - name: Run tests (QAOA)
        run: pytest tests -q -m slow

      # The generators must run clean from a fresh checkout -- that is the part worth
      # gating on. We deliberately do NOT byte-compare the output against the committed
      # copies: DELIVERABLE_4.html embeds base64 PNGs from matplotlib, whose bytes differ
      # between the Linux runner and the Windows machine these were generated on (font
      # rasterisation), so a strict diff would fail on every run regardless of correctness.
      - name: Rebuild the generated deliverables
        run: |
          python src/figures.py
          python src/make_deliverable4.py
          python src/make_onepager.py

      # Informational: show what moved, without failing the build. Numeric drift here is
      # expected when the runner's scikit-learn differs from the pinned local one.
      - name: Report any drift in the generated deliverables
        if: always()
        run: |
          if git diff --quiet -- DELIVERABLE_4.md; then
            echo "DELIVERABLE_4.md regenerated identically."
          else
            echo "::notice::DELIVERABLE_4.md changed on regeneration (usually a library-version difference)."
            git diff --stat -- DELIVERABLE_4.md
          fi
